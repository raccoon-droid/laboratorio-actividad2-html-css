<!DOCTYPE html>
<html>
    
    <!--Elaborado por Fernando Rodriguez Medel, 1972993, IEC-->
    <!--Actividad 2.3 Formulario-->
    
    <head>
        <meta charset="UTF-8"> <!--Necesario para incluir acentos-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Actividad 2.3 </title>
        <!--Se adjunta archivo CSS externo-->
        <link rel="stylesheet" type="text/css" href="..\Recursos\stylesheet.css">
    </head>

    <body>

    <!--Título personal para la página-->
        <h1> Ejercicio de la Actividad 2.3 </h1>
    <!--Título solicitado para la página-->
        <h2> FORMULARIO </h2>
    <!--Instrucciones del formulario-->
        <p>Por favor, conteste las preguntas que se solicitan a continuación:</p>
    
    <!--Inicio del campo del formulario, al finalizar se reenviará al índice-->
    <!--Esta práctica de laboratorio no contempla el almacenar las respuestas del formulario-->
        <form method="post" action="..\Índice.html">

            <!--Solicita Nombre con la etiqueta <input name=> establece un tamaño de letra y limite de-->
            <!--carácteres, además establece que es necesario llenar dicho campo-->
            <p> <label> Nombre: <input name="nombre" type="text" size="25" maxlength="30" required> </label></p>

            <!--Solicita Apellidos con la etiqueta <input name=> establece un tamaño de letra y limite de-->
            <!--carácteres, además establece que es necesario llenar dicho campo-->
            <p> <label> Apellidos: <input name="apellidos" type="text" size="25" maxlength="40" required> </label></p>

            <!--Solicita Correo con la etiqueta <input name=> establece un tamaño de letra y limite de-->
            <!--carácteres, además establece que es necesario llenar dicho campo.-->
            <!--Adicionalmente muestra un ejemplo de como llenar el campo.-->
            <p> <label> Correo electrónico: 
                <input name="email" type="email" size="25" maxlength="30" required placeholder="dirección.de.email@correo.com"> 
            </label></p>

            <!--Pestaña de "Detalles" al seleccionar la opción se desplegará una pregunta que-->
            <!--NO es necesaria llenar para enviar el formulario-->
            <details>
                <p> <label> Semestre:
                    <!--Para esta pregunta se da una serie de respuestas por medio de la etiqueta <select>-->
                    <select name="semestre">
                        <!--Opción predeterminada deshabilitada y oculta para el usuario al contestar-->
                        <option disabled selected hidden>Selecciona tu Semestre</option>
                        <!--Serie de respuestas posibles a la pregunta opcional-->
                        <option>Primer Semestre</option>
                        <option>Segundo Semestre</option>
                        <option>Tercer Semestre</option>
                        <option>Cuarto Semestre</option>
                        <option>Quinto Semestre</option>
                        <option>Sexto Semestre</option>
                        <option>Septimo Semestre</option>
                        <option>Octavo Semestre</option>
                        <option>Noveno Semestre</option>
                        <option>Décimo Semestre</option>
                    </select> 
                </label></p>                
            </details>

            <!--Botones para enviar o eliminar las respuestas del formulario-->
            <p>
            <!--Botón para subir las respuestas y reenviar al usuario a la página principal-->
                <input type="submit" value="Enviar cuestionario">
            <!--Botón para borrar las opciones del formulario-->
                <input type="reset" value="Borrar respuestas">
            </p>
            
            <!--Como añadido extra se incluye un botón para regresar a la página del índice-->
            <p>
                <button class="button">
                    <a href="..\index.html">Volver a página de inicio</a>
                </button>
            </p>
        </form>
    </body>
</html>
